# Relay settings (read by scripts/start_relay.sh on the Pi, and also by scripts/relay_stream.py defaults)

# Upstream camera URL (Gear 360 AP). The Pi must be connected to the camera Wi-Fi.
SOURCE_URL=http://192.168.43.1:7679/livestream_high.avi

# Where the relay listens on the Pi:
# - 0.0.0.0 = all interfaces (Ethernet + Wi-Fi). Your PC uses the Pi's LAN IP (often 10.0.0.x).
# - If you set a specific IP (e.g. the Pi Ethernet address), it ONLY listens on that interface.
BIND=0.0.0.0
PORT=7679

# Optional client allow-list (comma-separated). Empty = allow any host that can reach the Pi.
# ALLOW_IP=10.0.0.23
